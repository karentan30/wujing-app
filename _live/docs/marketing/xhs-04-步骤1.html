<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;font-family:'PingFang SC','Helvetica Neue',sans-serif;background:linear-gradient(160deg,#0d1025 0%,#1a2040 60%,#0f1830 100%)}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;padding:80px 72px;position:relative}
.step-badge{display:inline-flex;align-items:center;gap:12px;margin-bottom:36px;width:fit-content}
.step-num-big{width:68px;height:68px;background:linear-gradient(135deg,#5a96ff,#7c6fff);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#fff}
.step-of{font-size:22px;color:rgba(255,255,255,0.4)}
h1{font-size:68px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:16px}
h1 em{color:#5a96ff;font-style:normal}
.sub{font-size:28px;color:rgba(255,255,255,0.45);margin-bottom:48px}
.phone-mock{flex:1;display:flex;flex-direction:column;gap:20px}
.upload-zone{background:rgba(90,150,255,0.06);border:2px dashed rgba(90,150,255,0.3);border-radius:28px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;position:relative}
.upload-icon{font-size:80px}
.upload-title{font-size:34px;font-weight:bold;color:#fff}
.upload-sub{font-size:22px;color:rgba(255,255,255,0.4);text-align:center;line-height:1.6}
.upload-formats{display:flex;gap:12px;margin-top:8px}
.fmt{background:rgba(90,150,255,0.15);color:#5a96ff;font-size:18px;padding:6px 16px;border-radius:20px}
.or-divider{font-size:20px;color:rgba(255,255,255,0.25)}
.source-row{display:flex;gap:16px;justify-content:center}
.source-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 22px;display:flex;align-items:center;gap:10px;font-size:20px;color:rgba(255,255,255,0.6)}
.source-btn span{font-size:26px}
.steps-bottom{display:flex;flex-direction:column;gap:14px}
.step-row{display:flex;align-items:center;gap:20px;background:rgba(255,255,255,0.04);border-radius:16px;padding:18px 24px}
.step-dot{width:10px;height:10px;background:#5a96ff;border-radius:50%;flex-shrink:0}
.step-text-main{font-size:26px;color:#fff;font-weight:500}
.step-arrow{margin-left:auto;font-size:20px;color:rgba(255,255,255,0.2)}
.brand{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:20px;color:rgba(255,255,255,0.2);letter-spacing:1px}
</style></head>
<body>
<div class="wrap">
  <div class="step-badge">
    <div class="step-num-big">1</div>
    <div class="step-of">共 3 步</div>
  </div>
  <h1>上传<em>舞蹈视频</em><br>AI 开始工作</h1>
  <div class="sub">支持本地录制 · 抖音下载 · 小红书保存</div>
  <div class="phone-mock">
    <div class="upload-zone">
      <div class="upload-icon">📱</div>
      <div class="upload-title">拖入或选择视频</div>
      <div class="upload-sub">把你想学的舞蹈视频<br>直接上传进来</div>
      <div class="upload-formats">
        <div class="fmt">MP4</div>
        <div class="fmt">MOV</div>
        <div class="fmt">AVI</div>
      </div>
      <div class="or-divider">—— 或者从这里获取 ——</div>
      <div class="source-row">
        <div class="source-btn"><span>📲</span>抖音下载</div>
        <div class="source-btn"><span>📸</span>小红书</div>
        <div class="source-btn"><span>▶️</span>YouTube</div>
      </div>
    </div>
    <div class="steps-bottom">
      <div class="step-row">
        <div class="step-dot"></div>
        <div class="step-text-main">选择你想学的舞蹈</div>
        <div class="step-arrow">✓</div>
      </div>
      <div class="step-row">
        <div class="step-dot"></div>
        <div class="step-text-main">在App里直接上传</div>
        <div class="step-arrow">→</div>
      </div>
      <div class="step-row">
        <div class="step-dot" style="background:rgba(255,255,255,0.2)"></div>
        <div class="step-text-main" style="color:rgba(255,255,255,0.35)">AI 自动识别并拆解</div>
        <div class="step-arrow">→</div>
      </div>
    </div>
  </div>
</div>
<div class="brand">舞镜 wujing.mylumee.app</div>
</body></html>
