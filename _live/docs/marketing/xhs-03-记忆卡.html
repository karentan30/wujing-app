<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;font-family:'PingFang SC','Helvetica Neue',sans-serif;background:linear-gradient(160deg,#0d1025 0%,#1a2040 60%,#0f1830 100%)}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;padding:80px 72px;position:relative}
.tag{display:inline-block;background:rgba(255,200,80,0.15);border:1px solid rgba(255,200,80,0.4);color:#ffc850;font-size:24px;padding:10px 24px;border-radius:30px;margin-bottom:40px;width:fit-content}
h1{font-size:70px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:16px}
h1 em{color:#ffc850;font-style:normal}
.sub{font-size:28px;color:rgba(255,255,255,0.45);margin-bottom:48px}
.mem-card{flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,200,80,0.15);border-radius:28px;display:flex;flex-direction:column;overflow:hidden}
.mem-header{background:rgba(255,200,80,0.06);padding:28px 36px;border-bottom:1px solid rgba(255,200,80,0.1);display:flex;align-items:center;gap:20px}
.phrase-circle{width:72px;height:72px;background:rgba(255,200,80,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phrase-circle-text{font-size:34px;font-weight:900;color:#ffc850}
.phrase-info-col{flex:1}
.phrase-info-name{font-size:28px;color:#fff;font-weight:bold;margin-bottom:4px}
.phrase-info-time{font-size:18px;color:rgba(255,255,255,0.35)}
.big-char-area{padding:36px;display:flex;align-items:center;gap:32px}
.big-char{font-size:160px;font-weight:900;color:#fff;line-height:1;flex-shrink:0;text-shadow:0 0 60px rgba(255,200,80,0.3)}
.big-char-label{flex:1}
.big-char-title{font-size:22px;color:rgba(255,200,80,0.7);margin-bottom:10px;letter-spacing:1px}
.big-char-sub{font-size:28px;font-weight:bold;color:#ffc850;line-height:1.4}
.mnemo-box{margin:0 36px 24px;background:rgba(255,200,80,0.06);border:1px solid rgba(255,200,80,0.2);border-radius:16px;padding:24px 28px}
.mnemo-title{font-size:20px;color:rgba(255,200,80,0.6);margin-bottom:14px;letter-spacing:1px}
.mnemo-story{font-size:26px;color:#fff;line-height:1.7}
.mnemo-story em{color:#ffc850;font-style:normal;font-weight:bold}
.steps-box{margin:0 36px 32px;display:flex;flex-direction:column;gap:12px}
.step-row{display:flex;align-items:center;gap:16px}
.step-num{width:36px;height:36px;background:rgba(90,150,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#5a96ff;font-size:18px;font-weight:bold;flex-shrink:0}
.step-text{font-size:22px;color:rgba(255,255,255,0.65)}
.tip-bar{margin:0 36px;background:rgba(90,150,255,0.08);border-radius:12px;padding:16px 22px;text-align:center;font-size:22px;color:rgba(90,150,255,0.8)}
.cta{padding:28px 36px 0;text-align:center}
.cta-btn{display:inline-block;background:linear-gradient(90deg,#ffc850,#ff9d00);color:#1a1400;font-size:30px;font-weight:bold;padding:20px 56px;border-radius:50px;letter-spacing:2px}
.brand{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:20px;color:rgba(255,255,255,0.2);letter-spacing:1px}
</style></head>
<body>
<div class="wrap">
  <div class="tag">🧠 谐音记忆法</div>
  <h1>记不住？<br>用<em>谐音</em>来记</h1>
  <div class="sub">每句动作提炼一个核心字 · 睡前看3遍明天就会</div>
  <div class="mem-card">
    <div class="mem-header">
      <div class="phrase-circle"><div class="phrase-circle-text">5</div></div>
      <div class="phrase-info-col">
        <div class="phrase-info-name">飞燕转身</div>
        <div class="phrase-info-time">22.1s – 26.8s</div>
      </div>
    </div>
    <div class="big-char-area">
      <div class="big-char">转</div>
      <div class="big-char-label">
        <div class="big-char-title">核心字</div>
        <div class="big-char-sub">口诀：<br>转身飞燕<br>落定收势</div>
      </div>
    </div>
    <div class="mnemo-box">
      <div class="mnemo-title">💡 谐音记忆故事</div>
      <div class="mnemo-story">
        像<em>「砖」</em>头飞起来——<br>
        起身<em>转</em>，手臂像翅膀<em>摆</em>开，<br>
        飞燕<em>扬</em>，最后一步稳<em>收</em>定
      </div>
    </div>
    <div class="steps-box">
      <div class="step-row"><div class="step-num">1</div><div class="step-text">右脚起步，重心移右</div></div>
      <div class="step-row"><div class="step-num">2</div><div class="step-text">顺时针转身270°</div></div>
      <div class="step-row"><div class="step-num">3</div><div class="step-text">双臂展开模仿燕翅</div></div>
      <div class="step-row"><div class="step-num">4</div><div class="step-text">收脚并步，定格亮相</div></div>
    </div>
    <div class="tip-bar">😴 睡前回想口诀 → 次日记忆巩固率+40%</div>
    <div class="cta"><div class="cta-btn">🔗 免费生成记忆卡</div></div>
  </div>
</div>
<div class="brand">舞镜 wujing.mylumee.app</div>
</body></html>
