<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;overflow:hidden;font-family:'PingFang SC','Helvetica Neue',sans-serif;background:linear-gradient(160deg,#0d1025 0%,#1a2040 60%,#0f1830 100%)}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;padding:80px 72px;position:relative}
.badge{display:inline-flex;align-items:center;gap:10px;background:rgba(90,150,255,0.15);border:1px solid rgba(90,150,255,0.4);color:#5a96ff;font-size:24px;padding:10px 24px;border-radius:30px;margin-bottom:44px;width:fit-content}
.badge-dot{width:10px;height:10px;background:#5a96ff;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
h1{font-size:72px;font-weight:900;color:#fff;line-height:1.15;margin-bottom:16px}
h1 em{color:#5a96ff;font-style:normal}
.sub{font-size:28px;color:rgba(255,255,255,0.45);margin-bottom:56px}
.mirror-card{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.mirror-header{background:rgba(90,150,255,0.1);padding:24px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08)}
.mirror-title{font-size:26px;color:#fff;font-weight:bold}
.mirror-badge{background:rgba(90,150,255,0.3);color:#5a96ff;font-size:20px;padding:6px 18px;border-radius:20px}
.phrase-label{padding:24px 32px 12px;font-size:22px;color:rgba(255,255,255,0.4);letter-spacing:1px}
.phrase-name{padding:0 32px 20px;font-size:38px;font-weight:bold;color:#fff}
.frames-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 32px;flex:1}
.frame-box{background:rgba(255,255,255,0.05);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px;position:relative;overflow:hidden}
.frame-box::before{content:'↔';position:absolute;top:8px;right:8px;font-size:18px;color:rgba(90,150,255,0.6)}
.frame-icon{font-size:44px}
.frame-n{font-size:18px;color:rgba(255,255,255,0.3);margin-top:6px}
.flip-hint{margin:20px 32px;background:rgba(90,150,255,0.08);border:1px solid rgba(90,150,255,0.2);border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:16px}
.flip-icon{font-size:32px}
.flip-text{font-size:22px;color:#5a96ff;line-height:1.4}
.kou-area{margin:0 32px 24px;background:rgba(255,200,80,0.08);border:1px solid rgba(255,200,80,0.25);border-radius:12px;padding:18px 22px}
.kou-label{font-size:18px;color:rgba(255,200,80,0.6);margin-bottom:8px}
.kou-text{font-size:28px;font-weight:bold;color:#ffc850;letter-spacing:3px}
.cta{padding:32px 32px 0;text-align:center}
.cta-btn{display:inline-block;background:linear-gradient(90deg,#5a96ff,#7c6fff);color:#fff;font-size:30px;font-weight:bold;padding:20px 56px;border-radius:50px;letter-spacing:2px}
.brand{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:20px;color:rgba(255,255,255,0.2);letter-spacing:1px}
</style></head>
<body>
<div class="wrap">
  <div class="badge"><div class="badge-dot"></div>镜面模式 已开启</div>
  <h1>镜面练习<br>不用想<em>左右</em></h1>
  <div class="sub">AI 自动翻转帧图 · 和视频反着看才对</div>
  <div class="mirror-card">
    <div class="mirror-header">
      <div class="mirror-title">第 4 句 · 转身摆臂</div>
      <div class="mirror-badge">↔ 镜像已翻转</div>
    </div>
    <div class="phrase-label">动作名称</div>
    <div class="phrase-name">右转 → 摆臂 → 收势</div>
    <div class="frames-row">
      <div class="frame-box"><div class="frame-icon">💃</div><div class="frame-n">1</div></div>
      <div class="frame-box"><div class="frame-icon">🤸</div><div class="frame-n">2</div></div>
      <div class="frame-box"><div class="frame-icon">💃</div><div class="frame-n">3</div></div>
      <div class="frame-box"><div class="frame-icon">🩰</div><div class="frame-n">4</div></div>
      <div class="frame-box"><div class="frame-icon">💃</div><div class="frame-n">5</div></div>
      <div class="frame-box"><div class="frame-icon">🤸</div><div class="frame-n">6</div></div>
      <div class="frame-box"><div class="frame-icon">💃</div><div class="frame-n">7</div></div>
      <div class="frame-box"><div class="frame-icon">🩰</div><div class="frame-n">8</div></div>
    </div>
    <div class="flip-hint">
      <div class="flip-icon">🪞</div>
      <div class="flip-text">图中的「右手」= 你练的「右手」<br>不再搞反方向了</div>
    </div>
    <div class="kou-area">
      <div class="kou-label">动作口诀</div>
      <div class="kou-text">转 · 摆 · 扬 · 收</div>
    </div>
    <div class="cta"><div class="cta-btn">🔗 免费体验镜面模式</div></div>
  </div>
</div>
<div class="brand">舞镜 wujing.mylumee.app</div>
</body></html>
