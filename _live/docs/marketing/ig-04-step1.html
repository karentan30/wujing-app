<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(145deg,#0a0f20 0%,#111830 55%,#0d1525 100%)}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;padding:72px 88px;position:relative}
.step-row{display:flex;align-items:center;gap:16px;margin-bottom:36px}
.step-circle{width:66px;height:66px;background:linear-gradient(135deg,#5a96ff,#7c6fff);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#fff}
.step-meta{font-size:20px;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase}
h1{font-size:72px;font-weight:900;color:#fff;line-height:1.1;margin-bottom:16px;letter-spacing:-1px}
h1 em{color:#5a96ff;font-style:normal}
.sub{font-size:24px;color:rgba(255,255,255,0.4);margin-bottom:44px}
.upload-mock{flex:1;background:rgba(90,150,255,0.05);border:2px dashed rgba(90,150,255,0.25);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;margin-bottom:28px}
.up-icon{font-size:72px}
.up-main{font-size:30px;font-weight:bold;color:#fff}
.up-sub{font-size:20px;color:rgba(255,255,255,0.35)}
.sources{display:flex;gap:14px;margin-top:8px}
.src{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 18px;font-size:18px;color:rgba(255,255,255,0.5)}
.step-pills{display:flex;gap:0;width:100%}
.pill{flex:1;padding:18px 16px;text-align:center;font-size:20px;font-weight:600;position:relative}
.pill-1{background:rgba(90,150,255,0.2);border:1px solid rgba(90,150,255,0.4);color:#5a96ff;border-radius:14px 0 0 14px}
.pill-2,.pill-3{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.3);border-left:none}
.pill-3{border-radius:0 14px 14px 0}
.brand{position:absolute;bottom:36px;right:60px;font-size:18px;color:rgba(255,255,255,0.15)}
</style></head>
<body>
<div class="wrap">
  <div class="step-row">
    <div class="step-circle">1</div>
    <div class="step-meta">Step 1 of 3</div>
  </div>
  <h1>Upload Your<br><em>Dance Video</em></h1>
  <div class="sub">From your camera roll, TikTok, YouTube — anywhere.</div>
  <div class="upload-mock">
    <div class="up-icon">📱</div>
    <div class="up-main">Drop video here</div>
    <div class="up-sub">MP4 · MOV · AVI · any format</div>
    <div class="sources">
      <div class="src">📲 TikTok</div>
      <div class="src">▶️ YouTube</div>
      <div class="src">📸 Instagram</div>
    </div>
  </div>
  <div class="step-pills">
    <div class="pill pill-1">① Upload</div>
    <div class="pill pill-2">② AI Breaks Down</div>
    <div class="pill pill-3">③ Get Cards</div>
  </div>
</div>
<div class="brand">wujing.mylumee.app</div>
</body></html>
